<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المراجعة الصغرى والكبرى</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23342c;--mut:#6b7a72;--g:#1f6b4f;--r:#b3402f;--line:#e2d8c3;--acc:#c9a04a;--wheel1:#1f6b4f;--wheel2:#c9a04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13201b;--card:#1b2c25;--ink:#ece6d6;--mut:#9db0a6;--g:#4cc38f;--r:#ef7a68;--line:#2c4238;--acc:#d9b25c}}
:root[data-theme="dark"]{--bg:#13201b;--card:#1b2c25;--ink:#ece6d6;--mut:#9db0a6;--g:#4cc38f;--r:#ef7a68;--line:#2c4238;--acc:#d9b25c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif;height:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px;min-height:100%}
header{text-align:center;padding:10px 0 18px}
h1{margin:0;font-size:1.7rem;color:var(--g);line-height:1.5}
.halaqa{margin-top:6px;font-size:1.2rem;color:var(--acc);font-weight:700}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

/* main menu */
.menu{display:flex;flex-direction:column;gap:16px;margin-top:30px}
.menu-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:30px 20px;text-align:center;font-size:1.6rem;font-weight:700;color:var(--g);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.menu-card.tamayyuz{color:var(--acc)}
.menu-card:active{transform:scale(.98)}

/* wheel view */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:1rem}
.reset{background:var(--r);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-size:1rem}
.group-title{text-align:center;font-size:1.4rem;font-weight:700;margin:6px 0 10px;color:var(--g)}

.wheel-outer{position:relative;width:min(300px,76vw);height:min(300px,76vw);margin:16px auto 10px}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid var(--r);z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.wheel-zone{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--wheel1) 0 16.66%, var(--wheel2) 0 33.33%, var(--wheel1) 0 50%, var(--wheel2) 0 66.66%, var(--wheel1) 0 83.33%, var(--wheel2) 0 100%);box-shadow:0 4px 18px rgba(0,0,0,.2);transition:transform 3s cubic-bezier(.17,.67,.12,1);will-change:transform}
.wheel-zone::after{content:'';position:absolute;inset:14%;border-radius:50%;background:var(--bg)}
.num-badge{position:absolute;width:48px;height:48px;border-radius:50%;background:var(--card);border:3px solid var(--acc);color:var(--ink);font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
.num-badge.done{border-color:var(--g);background:var(--g);color:#fff;opacity:.55}

.spin-wrap{text-align:center;margin:14px 0 18px}
.spin-btn{background:var(--g);color:#fff;border:0;border-radius:999px;padding:14px 38px;font-size:1.3rem;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}

.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:16px;padding:16px;min-height:140px}
.panel.ok{border-top-color:var(--g)}.panel.no{border-top-color:var(--r)}
.placeholder{text-align:center;color:var(--mut);font-size:1.1rem;padding:26px 10px}
.spinning-msg{text-align:center;color:var(--acc);font-size:1.15rem;padding:26px 10px}
.ayah{font-size:1.6rem;line-height:2.1;text-align:center;margin:4px 0}
.ref{text-align:center;color:var(--mut);font-size:.95rem;margin-bottom:14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:1.1rem}
.btns .y.on{background:var(--g);border-color:var(--g);color:#fff}
.btns .n.on{background:var(--r);border-color:var(--r);color:#fff}
.score{text-align:center;margin-top:14px;color:var(--mut);font-size:1.05rem}
.result{margin-top:8px;text-align:center;font-size:1.25rem;font-weight:700;color:var(--g)}
.done-msg{text-align:center;color:var(--mut);font-size:1rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>المراجعة الصغرى والكبرى</h1>
<div class="halaqa">لحلقة الشيماء بنت الحارث</div>
</header>
<div id="app"></div>
</div>
<script>
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* verses kept in the exact order given; segment N on the wheel = verses[N-1] */
const DATA={
  itqan:{
    label:'مجموعة إتقان',
    surah:'سورة البقرة',
    labels:[1,2,3,4,5,6],
    spinOrder:[3,5,2,6,4,1],
    verses:[
      ["يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ",21],
      ["وَلَمَّا جَاءَهُمْ كِتَابٌ مِنْ عِنْدِ اللَّهِ مُصَدِّقٌ لِمَا مَعَهُمْ",89],
      ["إِنَّ اللَّهَ لَا يَسْتَحْيِي أَنْ يَضْرِبَ مَثَلًا مَا بَعُوضَةً فَمَا فَوْقَهَا",26],
      ["وَإِذْ قُلْنَا ادْخُلُوا هَٰذِهِ الْقَرْيَةَ فَكُلُوا مِنْهَا حَيْثُ شِئْتُمْ رَغَدًا",58],
      ["وَلَنْ تَرْضَىٰ عَنْكَ الْيَهُودُ وَلَا النَّصَارَىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ",120],
      ["وَقَالُوا كُونُوا هُودًا أَوْ نَصَارَىٰ تَهْتَدُوا ۗ قُلْ بَلْ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا",135]
    ]
  },
  tamayyuz:{
    label:'مجموعة التميز',
    surah:'سورة الطور',
    labels:[1,2,3,4,5,6],
    spinOrder:[6,3,1,4,2,5],
    verses:[
      ["وَالطُّورِ",1],
      ["وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌ لَهُمْ كَأَنَّهُمْ لُؤْلُؤٌ مَكْنُونٌ",24],
      ["إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَعِيمٍ",17],
      ["أَمْ تَأْمُرُهُمْ أَحْلَامُهُمْ بِهَٰذَا ۚ أَمْ هُمْ قَوْمٌ طَاغُونَ",32],
      ["وَإِنْ يَرَوْا كِسْفًا مِنَ السَّمَاءِ سَاقِطًا يَقُولُوا سَحَابٌ مَرْكُومٌ",44],
      ["أَفَسِحْرٌ هَٰذَا أَمْ أَنتُمْ لَا تُبْصِرُونَ",15]
    ]
  }
};

const state={
  itqan:{shown:Array(6).fill(false),result:Array(6).fill(null),active:null,rotation:0,spinCount:0,spinning:false,spinIndex:0},
  tamayyuz:{shown:Array(6).fill(false),result:Array(6).fill(null),active:null,rotation:0,spinCount:0,spinning:false,spinIndex:0}
};
let view='menu';

function app(){return document.getElementById('app');}

function renderMenu(){
  app().innerHTML=`
  <div class="menu">
    <button class="menu-card tamayyuz" onclick="openGroup('tamayyuz')">مجموعة التميز</button>
    <button class="menu-card" onclick="openGroup('itqan')">مجموعة إتقان</button>
  </div>`;
}

function openGroup(key){ view=key; renderWheel(); }
function backToMenu(){ view='menu'; renderMenu(); }

function resetGroup(){
  const s=state[view];
  s.shown.fill(false); s.result.fill(null); s.active=null; s.rotation=0; s.spinCount=0; s.spinning=false; s.spinIndex=0;
  renderWheel();
}

function mark(ok){
  const s=state[view];
  if(s.active===null) return;
  s.result[s.active] = s.result[s.active]===ok? null : ok;
  renderWheel();
}

function doSpin(){
  const s=state[view];
  if(s.spinning) return;
  if(s.spinIndex>=6) return;
  const g=DATA[view];
  const seq = s.spinIndex; // which verse in the fixed order is revealed this spin
  const choice = g.spinOrder[seq]-1; // the wheel position (0-based) that must land this spin
  s.spinning=true; s.active=null;
  s.spinCount += 1;
  const target = s.spinCount*360*3 + ((360 - choice*60) % 360);
  renderWheel(); // paint at the OLD rotation first, with transition still enabled
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      s.rotation = target;
      const wz = document.getElementById('wheelZone');
      if(wz){ wz.style.transform = `rotate(${target}deg)`; }
    });
  });
  setTimeout(()=>{
    s.spinning=false;
    s.active=seq;
    s.shown[choice]=true;
    s.spinIndex += 1;
    renderWheel();
  }, 3050);
}

function renderWheel(){
  const g=DATA[view], s=state[view];
  const R=38;
  let badges='';
  for(let i=0;i<6;i++){
    const angle=(-90 + i*60) * Math.PI/180;
    const left=50+R*Math.cos(angle), top=50+R*Math.sin(angle);
    const cls = s.shown[i] ? 'done' : '';
    badges += `<div class="num-badge ${cls}" style="left:${left}%;top:${top}%">${AR(g.labels[i])}</div>`;
  }

  let panelHtml, panelCls='';
  const remaining = 6 - s.spinIndex;
  if(s.spinning){
    panelHtml = `<div class="spinning-msg">🎡 العجلة تدور...</div>`;
  } else if(s.active===null){
    panelHtml = `<div class="placeholder">👆 اضغطي "تدوير" لاختيار مقطع</div>`;
  } else {
    const v = g.verses[s.active];
    panelCls = s.result[s.active]===true?'ok':s.result[s.active]===false?'no':'';
    panelHtml = `
      <div class="ayah">﴿ ${v[0]} ﴾</div>
      <div class="ref">${g.surah} – الآية ${AR(v[1])}</div>
      <div class="btns">
        <button class="y ${s.result[s.active]===true?'on':''}" onclick="mark(true)">✓ أكملت المقطع</button>
        <button class="n ${s.result[s.active]===false?'on':''}" onclick="mark(false)">✗ لم تكمل</button>
      </div>`;
  }
  const done=s.result.filter(x=>x!==null).length, ok=s.result.filter(x=>x===true).length;

  app().innerHTML = `
    <div class="topbar">
      <button class="back" onclick="backToMenu()">⟵ رجوع</button>
      <button class="reset" onclick="resetGroup()">إعادة 🔁</button>
    </div>
    <div class="group-title">${g.label}</div>
    <div class="wheel-outer">
      <div class="pointer"></div>
      <div class="wheel-zone" id="wheelZone" style="transform:rotate(${s.rotation}deg)">${badges}</div>
    </div>
    <div class="spin-wrap">
      <button class="spin-btn" onclick="doSpin()" ${s.spinning||remaining===0?'disabled':''}>🎡 تدوير</button>
      ${remaining===0?'<div class="done-msg">تم عرض كل المقاطع في هذه المجموعة</div>':''}
    </div>
    <div class="panel ${panelCls}">${panelHtml}</div>
    <div class="score">أكملت: ${AR(ok)} من ${AR(6)}</div>
    <div class="result">${done===6? `النتيجة النهائية: ${AR(ok)} / ${AR(6)} 🌟` : ''}</div>
  `;
}

renderMenu();
</script>
</body>
</html>
